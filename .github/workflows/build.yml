name: Compilar ccOpex (Direto)
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Empacotar no formato JASP
        run: |
          mkdir ccOpex
          rsync -av --exclude='ccOpex' --exclude='.git' --exclude='.github' ./ ccOpex/
          tar -czvf ccOpex.jaspModule ccOpex/

      - name: Disponibilizar Arquivo
        uses: actions/upload-artifact@v4
        with:
          name: ccOpex_Final
          path: ccOpex.jaspModule
