name: Compilar ccOpex
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empacotar no formato JASP
        run: tar -czvf ccOpex.jaspModule --exclude='.git' --exclude='.github' *
      - name: Disponibilizar Arquivo
        uses: actions/upload-artifact@v4
        with:
          name: ccOpex_Final
          path: ccOpex.jaspModule
