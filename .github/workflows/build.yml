name: Compilar ccOpex (Motor R)
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2

      - name: Instalar empacotador
        run: Rscript -e 'install.packages("pkgbuild")'

      - name: Construir Pacote
        run: Rscript -e 'pkgbuild::build(path = ".", dest_path = ".")'

      - name: Renomear para JASP
        run: mv *.tar.gz ccOpex.jaspModule

      - name: Disponibilizar Arquivo
        uses: actions/upload-artifact@v4
        with:
          name: ccOpex_Final
          path: ccOpex.jaspModule
